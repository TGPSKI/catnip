name: catnip-tools
# {{key}} means a tool measured it; <> in a prompt means the model writes it.
# Values reach subsequent turns only.
extract:
  # settled_day, not latest_day: latest_day is always the fetch's own day,
  # which GitHub reports as a flat zero. Every window ends on the settled
  # day, so every agent must name that one.
  - tool: catnip-store-status
    pattern: '"settled_day":\s*"([0-9]{4}-[0-9]{2}-[0-9]{2})"'
    store: settled_day
  # The tool decides staleness. A model comparing dates to "yesterday" is
  # doing arithmetic nobody checks, and it got the answer it wanted twice.
  - tool: catnip-store-status
    pattern: '"settled_expected":\s*"([0-9]{4}-[0-9]{2}-[0-9]{2})"'
    store: settled_expected
  - tool: catnip-store-status
    pattern: '"stale":\s*"(yes|no)"'
    store: stale
  - tool: catnip-store-status
    pattern: '"coverage":\s*(\[.*?\]\])'
    store: coverage
  - tool: catnip-store-status
    pattern: '"repos":\s*([0-9]+)'
    store: repos
  - tool: catnip-store-status
    pattern: '"schema_version":\s*([0-9]+)'
    store: schema_version
  # The days catnip measured GitHub still counting at or past the wait every
  # window rests on. An empty list is the healthy answer and the tool decides
  # which it is; a model reading the per-day table would be re-deriving the
  # verdict from the same coarse readings the tool already refused to
  # over-read.
  - tool: catnip-settle
    pattern: '"proven_short":\s*(\[[^\]]*\])'
    store: settle_proven_short
  - tool: catnip-report-read
    pattern: '([0-9]{4}-[0-9]{2}-[0-9]{2} to [0-9]{4}-[0-9]{2}-[0-9]{2})'
    store: window
  - tool: catnip-report-meta
    pattern: '"latest_day":\s*"([0-9]{4}-[0-9]{2}-[0-9]{2})"'
    store: report_latest_day
  - tool: catnip-report-meta
    pattern: '"written":\s*"([0-9A-Za-z]+)"'
    store: report_written
  - tool: catnip-report-meta
    pattern: '"provenance":\s*"([a-z]+)"'
    store: provenance
  - tool: catnip-prowl-dispatch
    pattern: '^dispatched ([0-9]+) brief'
    store: seeds_dispatched
  - tool: catnip-prowl-reopen
    pattern: '^re-opened ([0-9]+) cycle'
    store: cycles_reopened
  # 0 on most runs: a period settles about once a day and collection runs
  # four times. The tool counts what it queued, so no agent decides whether
  # a transition happened by reading dates.
  - tool: catnip-prowl-onsettle
    pattern: '^queued ([0-9]+) cycle'
    store: cycles_queued
  # catnip-prowl-record prints text, not JSON, so these are line-anchored.
  - tool: catnip-prowl-record
    pattern: '^cycle ([0-9]{4}-[0-9]{2}-[0-9]{2})$'
    store: prowl_cycle
  - tool: catnip-prowl-record
    pattern: '^wrote (\S+)$'
    store: prowl_published
  - tool: catnip-prowl-record
    pattern: '^  measured +([0-9]+)$'
    store: prowl_measured
  - tool: catnip-prowl-record
    pattern: '^  inferred +([0-9]+)$'
    store: prowl_inferred
  - tool: catnip-prowl-record
    pattern: '^  speculative +([0-9]+)$'
    store: prowl_speculative
  - tool: catnip-prowl-record
    pattern: '^  refuted +([0-9]+)$'
    store: prowl_refuted
tools:
  - name: catnip-report-read
    description: "Print the deterministic report without writing it"
    type: mcp
    mcp:
      server: shells
      tool: catnip_report_read
  - name: catnip-view
    description: "Print one derived view as text (requires view)"
    type: mcp
    mcp:
      server: shells
      tool: catnip_view
  - name: catnip-derivation
    description: "Print the formula and thresholds behind one view (requires view)"
    type: mcp
    mcp:
      server: shells
      tool: catnip_derivation
  - name: catnip-store-series
    description: "Print one repo's raw daily series from the store (requires repo)"
    type: mcp
    mcp:
      server: shells
      tool: catnip_store_series
  - name: catnip-prowl-edit-publish
    description: "Replace the published prowl.md with the edited document; refuses changed tier counts (requires document)"
    type: mcp
    mcp:
      server: shells
      tool: catnip_prowl_edit_publish
  - name: catnip-prowl-dispatch
    description: "Dispatch every SEED block as one analyst brief (requires cycle, window, seeds)"
    type: mcp
    mcp:
      server: shells
      tool: catnip_prowl_dispatch
  - name: catnip-store-sweep
    description: "Print every repo with traffic on the given day(s) from the store (requires dates, space-separated)"
    type: mcp
    mcp:
      server: shells
      tool: catnip_store_sweep
  - name: catnip-prowl-previous
    description: "Print the previous cycle's published prowl.md, or 'none'"
    type: mcp
    mcp:
      server: shells
      tool: catnip_prowl_previous
  - name: catnip-prowl-record
    description: "File every finding and refutation in one analysis, then publish the cycle's prowl.md (requires cycle, analysis)"
    type: mcp
    mcp:
      server: shells
      tool: catnip_prowl_record
  - name: catnip-prowl-reopen
    description: "Queue a re-run of any published cycle whose window the store has since revised"
    type: mcp
    mcp:
      server: shells
      tool: catnip_prowl_reopen
  - name: catnip-prowl-onsettle
    description: "Queue one inference cycle if a deterministic report has settled since the last call; queues nothing otherwise"
    type: mcp
    mcp:
      server: shells
      tool: catnip_prowl_onsettle
  - name: catnip-verify
    description: "Assert the analysis CSVs the TUI requires exist and are non-empty"
    type: mcp
    mcp:
      server: shells
      tool: catnip_verify
  - name: read_state
    description: "Read a value from a .state/ file (requires path)"
    type: mcp
    mcp:
      server: shells
      tool: read_state
  - name: catnip-run
    description: "Run the full catnip pipeline"
    type: mcp
    mcp:
      server: shells
      tool: catnip_run
  - name: write_state
    description: "Write a value to a .state/ file (requires path, content)"
    type: mcp
    mcp:
      server: shells
      tool: write_state
  - name: catnip-report-write
    description: "Write the deterministic report; refuses when the store has not advanced"
    type: mcp
    mcp:
      server: shells
      tool: catnip_report_write
  - name: catnip-report-meta
    description: "Print the newest written report's meta.json"
    type: mcp
    mcp:
      server: shells
      tool: catnip_report_meta
  - name: catnip-store-status
    description: "Print the durable store's newest day, coverage and repo count as JSON"
    type: mcp
    mcp:
      server: shells
      tool: catnip_store_status
  - name: catnip-settle
    description: "Print how long GitHub kept revising each recent day; proven_short lists days that contradict the configured wait"
    type: mcp
    mcp:
      server: shells
      tool: catnip_settle

agent: catnip-collect
# Every six hours. GitHub keeps revising a day for
# CATNIP_SETTLE_HOURS after it closes and a daily read can only
# place a revision to within 24h; four reads bound it to six, and
# each one recomputes the unsettled report from corrected data.
# :07 rather than the hour, so this is not competing with every
# other cron on the machine. leather's scheduler has no jitter of
# its own: internal/scheduler/cron.go computes the next fire time by
# incremental matching with no random offset, and there is no
# jitter field on a lifecycle. `catnip run --jitter` carries it
# instead, so the timeouts below cover a 40-minute wait plus a
# ~50-minute fetch, in that order:
#   catnip_run tool timeout 6600s < tool_timeout < timeout
schedule: "7 */6 * * *"
timeout: 7800s
tool_timeout: 7200s
tool_rounds: 12

output:
  - type: file
    path: .state/artifacts/{{.date}}-catnip-collect.txt
  # Collect's delivery is what triggers the report - no second cron guessing
  # when the fetch will finish. Intake stores the status block as a hide and
  # enqueues it on report-in; the report curing does the rest.
  - type: http
    url: http://127.0.0.1:7751/intake?kind=collect.result&source=catnip-collect&queue=report-in

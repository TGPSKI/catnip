hide_dir: .state/hides
artifact_dir: .state/artifacts
curing_dir: curings

queues:
  report-in:
    concurrency: 1
    max_attempts: 2
    max_depth: 50
  # One meta cycle per settled period, and depth 5 because a backlog here
  # is a symptom: a period settles about once a day, so five queued cycles
  # means five days of inference never ran.
  prowl-meta-in:
    concurrency: 1
    max_attempts: 2
    max_depth: 5
  prowl-analyze-in:
    concurrency: 2
    max_attempts: 2
    max_depth: 50
  prowl-write-in:
    concurrency: 1
    max_attempts: 2
    max_depth: 50
  editor-in:
    concurrency: 1
    max_attempts: 2
    max_depth: 50

name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
    # `labeled` is here so the `full-test` gate below actually works. The
    # default types are opened/synchronize/reopened, so adding the label
    # would fire nothing and the cross-platform matrix would stay skipped.
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

# Cancel superseded runs on the same ref (saves runner minutes on busy PRs).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Fast-feedback gate. Runs on every push and PR.
  #
  # catnip is stdlib-only and every test is offline — the pipeline tests
  # build synthetic run directories rather than calling GitHub, so CI needs
  # no token and cannot be rate-limited. 3.10 is the floor (the version
  # pane, the vendored drawing layer, targets); 3.14 is the ceiling.
  # ─────────────────────────────────────────────────────────────────────────
  validate:
    name: Validate (${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]

    steps:
      - name: Checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        # actions/setup-python v7.0.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}

      - name: Show interpreter
        run: python -VV

      # compile + unittest discovery + `bash -n` on both shell entry points.
      # The suite includes a pty smoke test that drives the real curses TUI.
      - name: Compile, tests, shell syntax
        run: make check PYTHON=python

      # The CLI must work from a fresh clone with nothing installed. This
      # catches a broken PYTHONPATH bootstrap, which no unit test would.
      - name: CLI smoke (no config, no credentials)
        run: |
          ./bin/catnip version
          ./bin/catnip help > /dev/null
          ./bin/catnip config
          ./bin/catnip timer print

  # ─────────────────────────────────────────────────────────────────────────
  # Lint. Separate job so a style failure doesn't mask a real test failure.
  # ─────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        # actions/setup-python v7.0.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"

      - name: Install ruff
        run: python -m pip install ruff

      - name: Ruff
        run: ruff check .

      # The unit templates are the contract with systemd; a typo in a
      # directive name is silently ignored at run time and the timer simply
      # never fires. Rendering them is the cheapest place to notice.
      - name: Unit templates render
        run: |
          ./bin/catnip timer print | tee /tmp/units.txt
          grep -q "Persistent=true" /tmp/units.txt
          ! grep -q "@CATNIP" /tmp/units.txt

  # ─────────────────────────────────────────────────────────────────────────
  # Cross-platform, full-scope checks.
  # Triggers:
  #   - PR carrying the `full-test` label
  #   - manual `workflow_dispatch`
  #   - any push to `main`
  # macOS matters here: it is the other platform where people actually run
  # a terminal dashboard, and where launchd replaces systemd.
  # ─────────────────────────────────────────────────────────────────────────
  full-scope:
    name: Full-scope (${{ matrix.label }})
    needs: validate
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
        contains(github.event.pull_request.labels.*.name, 'full-test')) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux/arm64
            os: ubuntu-24.04-arm
          - label: macos/arm64
            os: macos-14

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        # actions/setup-python v7.0.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"

      - name: Show toolchain
        run: python -VV

      - name: Tests
        run: make check PYTHON=python
